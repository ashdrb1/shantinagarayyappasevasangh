<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
body{font-family:'Inter', sans-serif;position:relative;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;}
.md-bg-layer{position:fixed;inset:0;background-color:#141018;background-image:linear-gradient(135deg, #6A11CB 0%, #2575FC 100%);background-size:100% 100%;background-repeat:no-repeat;background-position:0 0;opacity:1;z-index:0;}
.md-watermark{position:fixed;pointer-events:none;z-index:0;}
.md-watermark img{width:100%;height:100%;object-fit:fill;display:block;}
.md-content{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:46px 22px 60px;}
.md-logo-wrap{position:relative;display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-bottom:16px;max-width:100%;}
.md-logo-backdrop{position:absolute;inset:0;pointer-events:none;}
.md-logo-img{position:relative;display:block;object-fit:cover;}
.md-logo-hero-img{width:100%;height:100%;object-fit:cover;display:block;}
.md-logo-fade{position:absolute;left:0;right:0;bottom:0;pointer-events:none;}
.md-logo-banner-wrap{display:flex;flex-direction:column;align-items:center;width:100%;max-width:420px;margin-bottom:16px;}
.md-logo-banner{width:100%;flex:0 0 auto;}
.md-name{width:100%;font-weight:700;font-size:22px;color:#ffffff;text-align:center;margin-bottom:6px;word-break:break-word;}
.md-desc{width:100%;font-size:13px;color:#ffffff;opacity:.82;text-align:center;max-width:360px;margin-bottom:26px;line-height:1.5;}
.md-links{display:flex;flex-direction:column;gap:14px;width:100%;max-width:420px;}
.md-link-card{display:flex;align-items:center;gap:12px;padding:13px 16px;text-decoration:none;transition:transform .15s ease, filter .15s ease;}
.md-link-card:hover{transform:translateY(-2px);filter:brightness(1.07);}
.md-link-icon{border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex:0 0 auto;overflow:hidden;}
.md-link-text{display:flex;flex-direction:column;text-align:center;min-width:0;}
.md-link-label{font-weight:600;}
.md-link-desc{font-size:11.5px;opacity:.75;margin-top:1px;}
.md-empty-note{opacity:.65;font-size:13px;}
.md-footer{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;color:#ffffff;opacity:.45;}
.md-footer-below{margin-top:32px;display:flex;width:100%;}
.md-footer-fixed{position:fixed;left:0;right:0;bottom:14px;display:flex;padding:0 22px;z-index:2;}
@keyframes mdBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
@keyframes mdPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.16);}}
@keyframes mdSpin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
@keyframes mdWiggle{0%,100%{transform:rotate(0deg);}25%{transform:rotate(-10deg);}75%{transform:rotate(10deg);}}
@keyframes mdShake{0%,100%{transform:translateX(0);}20%{transform:translateX(-3px);}40%{transform:translateX(3px);}60%{transform:translateX(-3px);}80%{transform:translateX(3px);}}
@keyframes mdFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
@keyframes mdFlip{0%{transform:rotateY(0);}50%{transform:rotateY(180deg);}100%{transform:rotateY(360deg);}}
@keyframes mdSwing{0%,100%{transform:rotate(0deg);}15%{transform:rotate(14deg);}30%{transform:rotate(-10deg);}45%{transform:rotate(7deg);}60%{transform:rotate(-4deg);}75%{transform:rotate(2deg);}}
@keyframes mdHeartbeat{0%,100%{transform:scale(1);}14%{transform:scale(1.2);}28%{transform:scale(1);}42%{transform:scale(1.2);}70%{transform:scale(1);}}
@keyframes mdTada{0%,100%{transform:scale(1) rotate(0deg);}10%,20%{transform:scale(.92) rotate(-4deg);}30%,50%,70%,90%{transform:scale(1.1) rotate(4deg);}40%,60%,80%{transform:scale(1.1) rotate(-4deg);}}
@keyframes mdGlow{0%,100%{box-shadow:0 0 0 rgba(255,255,255,0);filter:brightness(1);}50%{box-shadow:0 0 16px rgba(255,255,255,.85);filter:brightness(1.25);}}
@keyframes mdJello{0%,100%{transform:skewX(0deg) skewY(0deg);}22%{transform:skewX(-10deg) skewY(-10deg);}44%{transform:skewX(6deg) skewY(6deg);}66%{transform:skewX(-3deg) skewY(-3deg);}88%{transform:skewX(1deg) skewY(1deg);}}
@keyframes mdRubberBand{0%,100%{transform:scale(1,1);}30%{transform:scale(1.22,.82);}45%{transform:scale(.85,1.18);}60%{transform:scale(1.1,.92);}75%{transform:scale(.96,1.04);}}
</style></head>
<body>
<div class="md-bg-layer"></div>

<div class="md-content">
  
  <div class="md-name">Your Brand</div>
  <div class="md-desc">Everything you need, in one place.</div>
  <div class="md-links"><a href="https://example.com" target="_blank" rel="noopener" class="md-link-card" style="background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,.14);border-radius:14px;color:#ffffff;font-size:14px;flex-direction:row;gap:12px;">
      <span class="md-link-icon" style="width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto;overflow:hidden;background:#6366F1;"><svg viewBox="0 0 24 24" width="22" height="22" fill="#ffffff" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" style="display:block;overflow:visible;color:#ffffff;"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.1 12h17.8M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></span>
      <span class="md-link-text">
        <span class="md-link-label">Website</span>
        
      </span>
    </a>
<a href="https://instagram.com/yourname" target="_blank" rel="noopener" class="md-link-card" style="background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,.14);border-radius:14px;color:#ffffff;font-size:14px;flex-direction:row;gap:12px;">
      <span class="md-link-icon" style="width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto;overflow:hidden;background:linear-gradient(135deg, #FEDA75, #D62976, #4F5BD5);"><svg viewBox="0 0 24 24" width="22" height="22" fill="#ffffff" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" style="display:block;overflow:visible;color:#ffffff;"><rect x="2.6" y="2.6" width="18.8" height="18.8" rx="5.4" fill="none" stroke="currentColor" stroke-width="1.9"/><circle cx="12" cy="12" r="4.35" fill="none" stroke="currentColor" stroke-width="1.9"/><circle cx="17.3" cy="6.75" r="1.25"/></svg></span>
      <span class="md-link-text">
        <span class="md-link-label">Instagram</span>
        
      </span>
    </a>
<a href="https://youtube.com/@yourname" target="_blank" rel="noopener" class="md-link-card" style="background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,.14);border-radius:14px;color:#ffffff;font-size:14px;flex-direction:row;gap:12px;">
      <span class="md-link-icon" style="width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto;overflow:hidden;background:#FF0000;"><svg viewBox="0 0 24 24" width="22" height="22" fill="#ffffff" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" style="display:block;overflow:visible;color:#ffffff;"><path d="M23.2 7.1a3 3 0 0 0-2.1-2.1C19.2 4.4 12 4.4 12 4.4s-7.2 0-9.1.6A3 3 0 0 0 .8 7.1C.2 9 .2 12 .2 12s0 3 .6 4.9a3 3 0 0 0 2.1 2.1c1.9.6 9.1.6 9.1.6s7.2 0 9.1-.6a3 3 0 0 0 2.1-2.1c.6-1.9.6-4.9.6-4.9s0-3-.6-4.9z"/><g fill="#FF0000" stroke="none"><path d="M9.75 15.4V8.6L15.6 12z"/></g></svg></span>
      <span class="md-link-text">
        <span class="md-link-label">YouTube</span>
        
      </span>
    </a></div>
  <div class="md-footer-below" style="justify-content:center;"><span class="md-footer"><span>Made with Glyph</span></span></div>
</div>

</body></html>
